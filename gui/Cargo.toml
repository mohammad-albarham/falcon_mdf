[package]
name = "falcon_mdf_gui"
# Tracks the library version, because that is what a release is tagged
# with: `falcon --version` has to name the release the binary came from,
# and a viewer stuck at 0.1.0 inside a v0.5.0 archive names nothing.
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "falcon"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.35.0", features = ["persistence"] }
egui = "0.35.0"
egui_plot = "0.36"
falcon_mdf = { path = "..", features = ["dbc"] }
rfd = "0.17.2"

# Consumed by `cargo bundle` (see PACKAGING.md) to produce a .app / .msi-less
# directory / AppImage-style bundle per platform; the PNG is converted to the
# platform's icon format at bundle time.
[package.metadata.bundle]
name = "Falcon"
identifier = "io.github.mohammad-albarham.falcon"
icon = ["assets/icon.png"]
category = "Developer Tool"
short_description = "A desktop viewer for MF4 measurement files"

[dev-dependencies]
# Already a dev-dependency of the library this wraps; batch tests write real
# files and read them back, which is the only way to test an operation whose
# whole job is to produce one.
tempfile = "3"
