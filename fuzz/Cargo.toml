[package]
name = "falcon_mdf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Its own workspace, so `cargo build` and `cargo test` in the parent do not try
# to build a target that needs nightly and libFuzzer.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.falcon_mdf]
path = ".."

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true
