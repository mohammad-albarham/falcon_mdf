[package]
name = "falcon_mdf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Its own workspace, so `cargo build` and `cargo test` in the parent do not try
# to build a target that needs nightly and libFuzzer.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.falcon_mdf]
path = ".."
features = ["mdf3", "dbc", "arxml"]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_bits"
path = "fuzz_targets/read_bits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mdf3"
path = "fuzz_targets/mdf3.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ldf"
path = "fuzz_targets/ldf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dbc"
path = "fuzz_targets/dbc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "arxml"
path = "fuzz_targets/arxml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "helper"
path = "src/bin/helper.rs"
test = false
doc = false
bench = false

[profile.release]
debug = true
