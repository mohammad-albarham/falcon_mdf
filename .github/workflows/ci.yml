name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.features.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `dbc` and `arxml` are off by default, so a featureless run compiles
        # neither src/dbc.rs, src/arxml.rs, tests/dbc_decoding.rs nor
        # tests/arxml_database.rs. Both axes are needed: the default build is
        # what most consumers get, the all-features build is the only one that
        # looks at the gated modules at all.
        features:
          - name: default
            flags: ""
          - name: all-features
            flags: "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The golden-value tests, the independent-reference cross-check and the
      # corpus-backed export tests run against third-party files this repo
      # deliberately does not redistribute. The fetch scripts pull them from
      # the projects that publish them; without this step those tests skip
      # silently and a green run would only prove the synthetic suite. The
      # bus-logging corpus has no public source, so its tests still skip.
      - name: Fetch the reference corpus
        shell: bash
        run: |
          if [ -f scripts/fetch_reference_files.sh ]; then
            bash scripts/fetch_reference_files.sh
          fi
          if [ -f scripts/fetch_arxml_files.sh ]; then
            bash scripts/fetch_arxml_files.sh
          fi
      - name: Build
        run: cargo build --all-targets ${{ matrix.features.flags }} --verbose
      - name: Test
        run: cargo test --all-targets ${{ matrix.features.flags }} --verbose
      - name: Doc tests
        run: cargo test --doc ${{ matrix.features.flags }} --verbose

  gui:
    name: gui (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The GUI's tests are headless, but the binary still has to link:
      # eframe needs xkbcommon and rfd's Linux backend needs GTK.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      - name: Build
        run: cargo build -p falcon_mdf_gui --all-targets
      - name: Test
        run: cargo test -p falcon_mdf_gui
      - name: Clippy
        run: cargo clippy -p falcon_mdf_gui --all-targets -- -D warnings

  conformance:
    name: conformance against asammdf (both directions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Both tests look for asammdf under ./.venv/bin/python and skip when it is
      # absent; this job exists so it is not absent here. An outside parser is
      # the only oracle that catches a writer and a reader sharing the same
      # misreading of the format.
      - name: Prepare the venv the tests look for
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet asammdf
      # write_conformance: asammdf reads what this crate writes.
      # sync_channel: this crate reads a video stream asammdf wrote — a shape no
      # published sample set contains, so the fixture has to be generated.
      - name: Run the conformance tests
        run: cargo test --test write_conformance --test sync_channel --all-features

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      # Build only, and only the library: the MSRV guarantee covers falcon_mdf,
      # not the dev-dependency graph nor the GUI, whose egui stack tracks a
      # newer toolchain by design.
      - name: Build
        run: cargo build -p falcon_mdf --verbose
      # Both gated modules too. An MSRV that only covers the default build is
      # not the number a consumer needs: `arxml` pulls `autosar-data`, which is
      # what sets this floor in the first place and declares no `rust-version`
      # of its own, so nothing but this step will notice when it moves.
      - name: Build with all features
        run: cargo build -p falcon_mdf --all-features --verbose

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --no-deps --all-features
      # Both axes, because an intra-doc link to a feature-gated module resolves
      # under --all-features and nowhere else. The default build is what a
      # consumer who enables nothing gets.
      - name: Build docs (default features)
        run: cargo doc --no-deps

  benches:
    name: benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Compile only. Timings from a shared CI runner are too noisy to gate on;
      # comparing runs needs `cargo bench -- --baseline <name>` on fixed
      # hardware, against the corpus, which CI does not have.
      - name: Build benchmarks
        run: cargo bench --no-run

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # fuzz/corpus/ is gitignored, so without seeds libFuzzer starts from
      # random bytes and spends the whole minute rediscovering the magic
      # bytes. A handful of real files from the reference set give it a
      # structured starting point instead.
      - name: Fetch seed files and seed corpus
        shell: bash
        run: |
          if [ -f scripts/fetch_reference_files.sh ]; then
            bash scripts/fetch_reference_files.sh
            mkdir -p fuzz/corpus/parse
            find test_data/reference -iname '*.mf4' | head -8 | xargs -I{} cp {} fuzz/corpus/parse/ || true
          fi
      # A short run on every push catches a crash reintroduced into the parse
      # path. Finding new ones needs a long run; that belongs on a schedule, not
      # in the pull-request loop — see fuzz.yml.
      - name: Fuzz parse for 60s
        run: cargo fuzz run parse -- -max_total_time=60 -rss_limit_mb=2048
      - name: Fuzz roundtrip for 60s
        run: cargo fuzz run roundtrip -- -max_total_time=60 -rss_limit_mb=2048

  package:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify package
        run: cargo publish --dry-run
