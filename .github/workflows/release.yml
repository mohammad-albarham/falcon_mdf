name: Release GUI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag used to go straight to a published binary: whatever compiled on the
  # release runner was what people downloaded, even if the tests were red.
  # Every build below waits on this.
  gate:
    name: gate (build + test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build -p falcon_mdf_gui --all-targets
      - name: Test
        run: cargo test -p falcon_mdf_gui
      - name: Clippy
        run: cargo clippy -p falcon_mdf_gui --all-targets -- -D warnings

  build-release-gui:
    name: build-gui (${{ matrix.os }}, ${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: falcon-gui-linux-x86_64.tar.gz
            asset_path: falcon-gui-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: falcon-gui-macos-arm64.zip
            asset_path: falcon-gui-macos-arm64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: falcon-gui-macos-x86_64.zip
            asset_path: falcon-gui-macos-x86_64.zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: falcon-gui-windows-x86_64.zip
            asset_path: falcon-gui-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev

      - name: Build GUI Release Binary
        run: cargo build --release -p falcon_mdf_gui --target ${{ matrix.target }}

      # `--version` is the one thing every archive must do, and it is the
      # cheapest possible proof that what was packaged actually runs. It needs
      # no display, so it works on all three runners. Cross-compiled x86_64 on
      # an arm64 macOS runner is the exception — Rosetta may be absent, so the
      # binary is not run there.
      - name: Smoke test the built binary
        if: "!(runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin')"
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/falcon
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="$BIN.exe"
          fi
          "$BIN" --version
          "$BIN" --help > /dev/null

      # Shipped beside the binary because a downloaded archive is all most
      # people ever see of this project: the viewer's own guide, not just the
      # library README, and on macOS the Gatekeeper step without which an
      # unsigned download looks broken rather than unsigned.
      - name: Collect package contents
        shell: bash
        run: |
          mkdir -p package_dir
          cp LICENSE-MIT LICENSE-APACHE README.md package_dir/
          cp gui/RUNNING.md package_dir/RUNNING.md
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp gui/FIRST-RUN-MACOS.md package_dir/FIRST-RUN.md
          fi

      - name: Package Linux Artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/falcon package_dir/
          tar -czvf ${{ matrix.artifact_name }} -C package_dir .

      - name: Package macOS Artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/falcon package_dir/
          cd package_dir && zip -r ../${{ matrix.artifact_name }} . && cd ..

      - name: Package Windows Artifact
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/falcon.exe package_dir/
          cd package_dir && 7z a ../${{ matrix.artifact_name }} * && cd ..

      # These binaries are unsigned on every platform, so a checksum is the
      # only integrity check a downloader has. `sha256sum` on the Linux and
      # Windows runners, `shasum` on macOS, which has no `sha256sum`.
      - name: Checksum the artifact
        shell: bash
        run: |
          if command -v sha256sum > /dev/null; then
            sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          fi
          cat ${{ matrix.artifact_name }}.sha256

      - name: Upload GUI Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.asset_path }}
            ${{ matrix.asset_path }}.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
