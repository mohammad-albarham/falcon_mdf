[package]
name = "falcon_mdf"
version = "0.4.0"
edition = "2021"
authors = ["Mohammad Albarham <mohammedbrham98@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "High-performance Rust library for reading ASAM MDF v4 (MF4) measurement data files"
repository = "https://github.com/mohammad-albarham/falcon_mdf"
documentation = "https://docs.rs/falcon_mdf"
readme = "README.md"
keywords = ["mdf", "mf4", "asam", "automotive", "measurement"]
categories = ["parsing", "science", "data-structures"]
# Set by `autosar-data`, which the `arxml` feature pulls in. Not by its
# `edition = "2024"` — that alone would only need 1.85 — but by the let-chains
# in `autosar-data-specification`, stable since 1.88. Neither crate declares a
# `rust-version`, so cargo cannot report this; it was found by building on 1.87
# and watching it fail. Verified by building `--all-features` on 1.88 in CI.
rust-version = "1.88"
exclude = [
    "/test_data",
    "/.github",
    "/plan_ready_production.md",
    "/plan_bus_decoding.md",
    # Agent configuration and the remaining planning document — working state
    # of this repository, not content of the crate.
    "/.claude",
    "/plan_gui.md",
    # Development utilities for fetching reference data and generating golden
    # files; nothing a consumer of the crate runs.
    "/scripts",
    # Dev-utility binaries that cargo auto-discovers under examples/ but that
    # are not declared as examples — excluded so they do not ship.
    "/examples/analyze_mf4.rs",
    "/examples/bench.rs",
    "/examples/dump_one.rs",
    "/examples/inspect_channel.rs",
    "/examples/list_header_channels.rs",
    "/examples/memcheck.rs",
    "/examples/profile.rs",
    "/examples/read_signal.rs",
]

# `dbc` and `arxml` are off by default, so without this docs.rs would publish
# documentation for neither gated module.
[package.metadata.docs.rs]
all-features = true

[dependencies]
# Memory-mapped file support
memmap2 = { version = "0.9", optional = true }

# Error handling
thiserror = "2.0"

# Byte order handling
byteorder = "1.5"

# Logging
log = "0.4"

# Compression support (for DZ blocks)
flate2 = "1.0"
lz4_flex = { version = "0.11", optional = true }
ruzstd = { version = "0.7", optional = true }

# XML parsing for MD (metadata) blocks
quick-xml = "0.37"
rayon = { version = "1.11.0", optional = true }
# CAN database parsing for bus signal decoding, behind the `dbc` feature.
can-dbc = { version = "10", optional = true }
# AUTOSAR ARXML parsing for bus signal decoding, behind the `arxml` feature.
# This is the dependency that sets the crate's MSRV: it is `edition = "2024"`.
autosar-data = { version = "0.22.0", optional = true }
# Apache Parquet output, behind the `parquet` feature. Default features off:
# they pull in four more compression codecs and a SIMD UTF-8 validator, none of
# which a writer that emits Snappy needs. `arrow` is what gives us typed,
# nullable columns without hand-rolling definition levels; `snap` is Parquet's
# de-facto default codec, which every reader understands.
parquet = { version = "59", optional = true, default-features = false, features = [
    "arrow",
    "snap",
] }
# The array and schema builders the Parquet writer feeds. Already in the tree
# as `parquet`'s own dependencies; named here because `parquet` does not
# re-export them, and pinned to the same major version because an Arrow array
# built by one version cannot be written by another.
arrow-array = { version = "59", optional = true, default-features = false }
arrow-schema = { version = "59", optional = true, default-features = false }
# Arrow IPC file format writer, behind the `arrow` feature. Used to hand off
# decoded tables directly to pandas, polars and other dataframe runtimes
# without going through Parquet.
arrow-ipc = { version = "59", optional = true, default-features = false }
hdf5-pure = { version = "0.39", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"], optional = true }

# Optional: for async support in future
# tokio = { version = "1", features = ["fs", "io-util"], optional = true }

[dev-dependencies]
criterion = "0.5"
# Already a dependency; listed again so integration tests can build the
# compressed attachments they read back.
flate2 = "1.0"
lz4_flex = "0.11"
zstd = "0.13"
tempfile = "3.10"
serde_json = "1.0"
env_logger = "0.11"
csv = "1.3"

[features]
default = ["mmap", "parallel"]
mmap = ["dep:memmap2"]
parallel = ["dep:rayon"]
dbc = ["dep:can-dbc"]
arxml = ["dep:autosar-data"]
lz4 = ["dep:lz4_flex"]
mdf3 = []
zstd = ["dep:ruzstd"]
# Apache Arrow RecordBatch and Arrow IPC export.
arrow = ["dep:arrow-array", "dep:arrow-schema", "dep:arrow-ipc"]
# Apache Parquet export. Off by default: it is the one writer that brings a
# dependency tree with it, and a plain read should pull in no writer at all.
parquet = ["dep:parquet", "arrow"]
# MATLAB version 4 MAT-file export. No dependency: the format is written by hand
# against the published specification.
mat4 = []
# MATLAB level 5 MAT-file export. No dependency: the format is written by hand
# against the published specification, and the only compression it can use is
# the zlib we already link for DZ blocks.
mat = []
# MATLAB v7.3 MAT-file export. This is an HDF5 file with a MAT userblock and
# MATLAB_class attributes, so it reuses the `hdf5` feature.
mat73 = ["hdf5"]
# HDF5 export, behind the `hdf5` feature.
hdf5 = ["dep:hdf5-pure"]
# Vector CANoe ASCII trace export, behind the `asc` feature.
asc = ["dep:chrono"]

[[bench]]
name = "read"
harness = false

[[example]]
name = "list_channels"
path = "examples/list_channels.rs"

[[example]]
name = "export_to_csv"
path = "examples/export_to_csv.rs"

[[example]]
name = "write_mf4"
path = "examples/write_mf4.rs"

[[example]]
name = "block_map"
path = "examples/block_map.rs"

[[example]]
name = "decode_bus"
path = "examples/decode_bus.rs"
required-features = ["dbc"]

[[example]]
name = "analyze_mf4"
path = "examples/analyze_mf4.rs"
required-features = ["mmap"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[workspace]
members = ["gui", "python", "wasm"]
# Agent worktrees are checked out inside the repo, so cargo would otherwise
# treat their copy of this package as a member of this workspace and refuse to
# build them.
exclude = [".claude/worktrees"]
