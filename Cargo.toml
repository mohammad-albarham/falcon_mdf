[package]
name = "falcon_mdf"
version = "0.1.0"
edition = "2021"
authors = ["Falcon MDF Contributors"]
license = "MIT OR Apache-2.0"
description = "High-performance Rust library for reading ASAM MDF v4 (MF4) measurement data files"
repository = "https://github.com/falcon-mdf/falcon_mdf"
documentation = "https://docs.rs/falcon_mdf"
readme = "README.md"
keywords = ["mdf", "mf4", "asam", "automotive", "measurement"]
categories = ["parsing", "science", "data-structures"]

[dependencies]
# Memory-mapped file support
memmap2 = "0.9"

# Error handling
thiserror = "1.0"

# Byte order handling
byteorder = "1.5"

# Logging
log = "0.4"

# Compression support (for DZ blocks)
flate2 = "1.0"
rayon = "1.11.0"

# Optional: for async support in future
# tokio = { version = "1", features = ["fs", "io-util"], optional = true }

[dev-dependencies]
tempfile = "3.10"
env_logger = "0.11"
csv = "1.3"

[features]
default = ["mmap"]
mmap = []
# async = ["tokio"]

[[example]]
name = "list_channels"
path = "examples/list_channels.rs"

[[example]]
name = "export_to_csv"
path = "examples/export_to_csv.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
