[project]
site_name = "Falcon MDF"
site_description = "Read, write, and explore ASAM MDF measurements with Rust."
site_url = "https://mohammad-albarham.github.io/falcon_mdf/docs/"
repo_url = "https://github.com/mohammad-albarham/falcon_mdf"
repo_name = "mohammad-albarham/falcon_mdf"
docs_dir = "docs/site"
site_dir = "site"
edit_uri = "edit/main/docs/site/"
copyright = "Falcon MDF is licensed under MIT or Apache-2.0."
nav = [
  { "Overview" = "index.md" },
  { "Getting started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Rust quickstart" = "getting-started/quickstart.md" },
  ] },
  { "Guides" = [
    { "Read channels" = "guides/reading.md" },
    { "Write measurements" = "guides/writing.md" },
    { "Decode bus data" = "guides/bus-data.md" },
  ] },
  { "Integrations" = [
    { "Python" = "integrations/python.md" },
    { "Browser and WebAssembly" = "integrations/browser.md" },
  ] },
  { "Reference" = [
    { "Features" = "reference/features.md" },
    { "Architecture" = "reference/architecture.md" },
    { "Limits and errors" = "reference/limits.md" },
    { "Performance" = "reference/performance.md" },
    { "Rust API" = "https://docs.rs/falcon_mdf" },
  ] },
]

[project.theme]
variant = "modern"
language = "en"
logo = "assets/mascot.svg"
favicon = "assets/mascot.svg"
font.text = "Inter"
font.code = "JetBrains Mono"
features = [
  "navigation.sections",
  "navigation.expand",
  "navigation.path",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.footer",
  "navigation.top",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.action.edit",
]

# Same palette as prek: indigo primary, blue accent, and an automatic mode
# that follows the operating system until the reader picks one.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "blue"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
